<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0A2E1A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sunGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="leafGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52B788;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fond vert forêt (agriculture) -->
  <rect width="300" height="120" rx="12" fill="url(#bgGrad5)"/>

  <!-- Motif de fond subtil: hexagones (nids d'abeilles = solaire) -->
  <!-- Hexagones discrets en arrière-plan -->
  <g opacity="0.06" fill="#FFD700">
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(0,0)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(25,0)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(50,0)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(12,16)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(37,16)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(0,32)"/>
    <polygon points="20,10 30,10 35,19 30,28 20,28 15,19" transform="translate(25,32)"/>
  </g>

  <!-- Halo lumineux -->
  <circle cx="58" cy="60" r="50" fill="url(#glowGrad5)"/>

  <!-- Badge circulaire principal -->
  <circle cx="58" cy="60" r="46" fill="none" stroke="#52B788" stroke-width="1" opacity="0.4"/>
  <circle cx="58" cy="60" r="42" fill="#0D2B1A" opacity="0.7"/>

  <!-- Feuille / épi de blé stylisé (gauche) -->
  <g transform="translate(58,60)">
    <!-- Tige gauche -->
    <path d="M-30,20 Q-25,0 -15,-15" fill="none" stroke="url(#leafGrad5)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Feuilles gauches -->
    <path d="M-20,5 Q-32,-2 -28,-14 Q-18,-8 -20,5" fill="url(#leafGrad5)" opacity="0.7"/>
    <!-- Tige droite -->
    <path d="M30,20 Q25,0 15,-15" fill="none" stroke="url(#leafGrad5)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Feuilles droites -->
    <path d="M20,5 Q32,-2 28,-14 Q18,-8 20,5" fill="url(#leafGrad5)" opacity="0.7"/>
  </g>

  <!-- Soleil central dans le badge -->
  <g transform="translate(58,55)">
    <!-- Rayons extérieurs (fins, géométriques) -->
    <g stroke="#FFD700" stroke-linecap="round">
      <!-- 12 rayons équidistants -->
      <line x1="0" y1="-28" x2="0" y2="-34" stroke-width="2"/>
      <line x1="14" y1="-24" x2="17" y2="-29" stroke-width="2"/>
      <line x1="24" y1="-14" x2="29" y2="-17" stroke-width="2"/>
      <line x1="28" y1="0" x2="34" y2="0" stroke-width="2"/>
      <line x1="24" y1="14" x2="29" y2="17" stroke-width="2"/>
      <line x1="14" y1="24" x2="17" y2="29" stroke-width="2"/>
      <line x1="0" y1="28" x2="0" y2="34" stroke-width="2"/>
      <line x1="-14" y1="24" x2="-17" y2="29" stroke-width="2"/>
      <line x1="-24" y1="14" x2="-29" y2="17" stroke-width="2"/>
      <line x1="-28" y1="0" x2="-34" y2="0" stroke-width="2"/>
      <line x1="-24" y1="-14" x2="-29" y2="-17" stroke-width="2"/>
      <line x1="-14" y1="-24" x2="-17" y2="-29" stroke-width="2"/>
    </g>

    <!-- Cercle intermédiaire -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.5"/>

    <!-- Disque solaire -->
    <circle cx="0" cy="0" r="18" fill="url(#sunGrad5)"/>

    <!-- Panneau PV dans le disque (superposé, style "circuit") -->
    <clipPath id="pvClip5"><circle cx="0" cy="0" r="18"/></clipPath>
    <g clip-path="url(#pvClip5)">
      <!-- Lignes de cellules PV -->
      <line x1="-18" y1="-6" x2="18" y2="-6" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
      <line x1="-18" y1="6" x2="18" y2="6" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
      <line x1="-6" y1="-18" x2="-6" y2="18" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
      <line x1="6" y1="-18" x2="6" y2="18" stroke="#8B4513" stroke-width="0.7" opacity="0.5"/>
    </g>

    <!-- Point central lumineux -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
  </g>

  <!-- Texte HELIA -->
  <text x="115" y="44" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="900"
        fill="#FFFFFF" letter-spacing="5">HELIA</text>
  <!-- PV badge vert -->
  <rect x="230" y="24" width="30" height="18" rx="4" fill="#27AE60"/>
  <text x="245" y="37" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PV</text>

  <!-- Ligne décorative verte -->
  <line x1="115" y1="52" x2="282" y2="52" stroke="#52B788" stroke-width="1" opacity="0.6"/>

  <!-- Sous-titre -->
  <text x="115" y="68" font-family="Arial, sans-serif" font-size="10" fill="#52B788" letter-spacing="2.5">SOLAIRE · AGRICOLE</text>

  <!-- Citation mythologique -->
  <text x="115" y="84" font-family="Georgia, serif" font-size="9.5" fill="#FFD700" opacity="0.8" font-style="italic">"Lumière du char céleste sur vos champs"</text>

  <!-- Footer AgriWeb -->
  <line x1="115" y1="92" x2="282" y2="92" stroke="#52B788" stroke-width="0.5" opacity="0.3"/>
  <text x="115" y="106" font-family="Arial, sans-serif" font-size="8" fill="#52B788" opacity="0.6" letter-spacing="2">AGRIWEB  ·  PHOTOVOLTAÏQUE  ·  IA</text>
</svg>
