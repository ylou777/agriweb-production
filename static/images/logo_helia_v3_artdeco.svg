<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2137;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#061220;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sunGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE566;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fond nuit étoilée -->
  <rect width="300" height="120" rx="12" fill="url(#bgGrad3)"/>
  <!-- Étoiles décoratives -->
  <circle cx="15" cy="12" r="0.8" fill="#FFD700" opacity="0.5"/>
  <circle cx="285" cy="20" r="0.8" fill="#FFD700" opacity="0.5"/>
  <circle cx="250" cy="8" r="0.6" fill="#FFD700" opacity="0.4"/>
  <circle cx="290" cy="55" r="0.7" fill="#FFD700" opacity="0.4"/>
  <circle cx="10" cy="90" r="0.8" fill="#FFD700" opacity="0.3"/>
  <circle cx="275" cy="100" r="0.6" fill="#FFD700" opacity="0.3"/>

  <!-- Soleil Art Déco - hexagone central -->
  <g transform="translate(58,60)">
    <!-- Forme Art Déco : polygone à 12 branches -->
    <polygon points="0,-50 8,-22 22,-38 14,-10 38,-14 22,8 50,0 22,8 38,22 14,14 22,38 8,14 0,50 -8,14 -22,38 -14,14 -38,22 -22,8 -50,0 -22,8 -38,-14 -14,-10 -22,-38 -8,-22"
             fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
    <!-- 8 rayons triangulaires -->
    <polygon points="0,-50 -6,-28 6,-28" fill="#FFD700" opacity="0.7"/>
    <polygon points="0,50 -6,28 6,28" fill="#FFD700" opacity="0.7"/>
    <polygon points="-50,0 -28,-6 -28,6" fill="#FFD700" opacity="0.7"/>
    <polygon points="50,0 28,-6 28,6" fill="#FFD700" opacity="0.7"/>
    <polygon points="-35,-35 -20,-26 -26,-20" fill="#F5A623" opacity="0.6"/>
    <polygon points="35,-35 26,-20 20,-26" fill="#F5A623" opacity="0.6"/>
    <polygon points="35,35 20,26 26,20" fill="#F5A623" opacity="0.6"/>
    <polygon points="-35,35 -26,20 -20,26" fill="#F5A623" opacity="0.6"/>

    <!-- Anneau extérieur Art Déco -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Cercle intermédiaire -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#F5A623" stroke-width="1.5"/>

    <!-- Hexagone intérieur (panneau solaire) -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"
             fill="url(#sunGrad3)" opacity="0.9"/>
    <!-- Grille hexagone -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"
             fill="none" stroke="#2C1810" stroke-width="0.6"/>
    <line x1="-19" y1="-11" x2="19" y2="-11" stroke="#2C1810" stroke-width="0.6"/>
    <line x1="-19" y1="11" x2="19" y2="11" stroke="#2C1810" stroke-width="0.6"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#2C1810" stroke-width="0.6"/>
    <!-- Point central lumineux -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
  </g>

  <!-- Ligne sol / horizon (agriculture) -->
  <line x1="10" y1="108" x2="108" y2="108" stroke="url(#greenGrad3)" stroke-width="1.5"/>
  <!-- Petites herbes / épis -->
  <g transform="translate(0,108)" stroke="#27AE60" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <line x1="20" y1="0" x2="18" y2="-6"/>
    <line x1="30" y1="0" x2="30" y2="-8"/>
    <line x1="40" y1="0" x2="42" y2="-5"/>
    <line x1="50" y1="0" x2="50" y2="-7"/>
    <line x1="60" y1="0" x2="58" y2="-6"/>
    <line x1="70" y1="0" x2="70" y2="-8"/>
    <line x1="80" y1="0" x2="82" y2="-5"/>
    <line x1="90" y1="0" x2="88" y2="-7"/>
    <line x1="100" y1="0" x2="100" y2="-6"/>
  </g>

  <!-- Séparateur vertical décoratif -->
  <rect x="115" y="20" width="2" height="80" rx="1" fill="#FFD700" opacity="0.3"/>

  <!-- Texte HELIA (modern sans-serif feel) -->
  <text x="130" y="46" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="900"
        fill="#FFFFFF" letter-spacing="6">HELIA</text>
  <!-- PV en surbrillance -->
  <text x="246" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        fill="url(#sunGrad3)">PV</text>
  <!-- Ligne séparatrice -->
  <line x1="130" y1="54" x2="285" y2="54" stroke="#FFD700" stroke-width="0.8" opacity="0.5"/>
  <!-- Sous-titre -->
  <text x="130" y="70" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" letter-spacing="3">ÉNERGIE SOLAIRE AGRICOLE</text>
  <!-- Tagline -->
  <text x="130" y="88" font-family="'Times New Roman', serif" font-size="10" fill="#F5A623" letter-spacing="1" font-style="italic">Fille d'Hélios, lumière des champs</text>
  <!-- Badge AgriWeb -->
  <rect x="130" y="96" width="58" height="14" rx="3" fill="#27AE60" opacity="0.2"/>
  <text x="159" y="106" font-family="Arial, sans-serif" font-size="8" fill="#2ECC71" text-anchor="middle" letter-spacing="1">AgriWeb</text>
</svg>
