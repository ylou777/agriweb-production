<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <radialGradient id="sunGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#F5A623;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:0.8"/>
    </radialGradient>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="300" height="120" rx="12" fill="url(#bgGrad1)"/>

  <!-- Rayons de soleil -->
  <g transform="translate(58,60)">
    <!-- Rayons longs -->
    <line x1="0" y1="-45" x2="0" y2="-55" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="0" y2="55" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="-45" y1="0" x2="-55" y2="0" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="0" x2="55" y2="0" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <!-- Rayons diagonaux -->
    <line x1="-32" y1="-32" x2="-39" y2="-39" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="-32" x2="39" y2="-39" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="39" y2="39" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-32" y1="32" x2="-39" y2="39" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rayons secondaires -->
    <line x1="17" y1="-43" x2="21" y2="-53" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-17" y1="-43" x2="-21" y2="-53" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="43" y1="17" x2="53" y2="21" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="43" y1="-17" x2="53" y2="-21" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-43" y1="17" x2="-53" y2="21" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-43" y1="-17" x2="-53" y2="-21" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="17" y1="43" x2="21" y2="53" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-17" y1="43" x2="-21" y2="53" stroke="#F5A623" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Disque solaire -->
    <circle cx="0" cy="0" r="36" fill="url(#sunGrad1)"/>

    <!-- Grille panneau solaire sur le disque -->
    <clipPath id="sunClip1"><circle cx="0" cy="0" r="36"/></clipPath>
    <g clip-path="url(#sunClip1)">
      <line x1="-36" y1="-12" x2="36" y2="-12" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
      <line x1="-36" y1="12" x2="36" y2="12" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
      <line x1="-12" y1="-36" x2="-12" y2="36" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
      <line x1="12" y1="-36" x2="12" y2="36" stroke="#E8A000" stroke-width="0.8" opacity="0.6"/>
    </g>
    <!-- Anneau doré -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>

  <!-- Texte HELIA -->
  <text x="125" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold"
        fill="#FFD700" letter-spacing="4">HELIA</text>
  <!-- Ligne décorative -->
  <line x1="125" y1="62" x2="275" y2="62" stroke="#F5A623" stroke-width="1" opacity="0.5"/>
  <!-- Sous-texte PV -->
  <text x="125" y="80" font-family="Georgia, serif" font-size="13" fill="#F5A623" letter-spacing="6" opacity="0.9">P H O T O V O L T A Ï Q U E</text>
  <!-- Devise-->
  <text x="125" y="100" font-family="Arial, sans-serif" font-size="9" fill="#FFD700" opacity="0.6" letter-spacing="2">☀ DÉESSE SOLAIRE · ÉNERGIE AGRICOLE</text>
</svg>
