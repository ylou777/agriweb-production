<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C1810;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A2000;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="goddessGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C8860A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Fond riche ambré -->
  <rect width="300" height="120" rx="12" fill="url(#bgGrad2)"/>

  <!-- Halo lumineux derrière la déesse -->
  <circle cx="55" cy="58" r="48" fill="url(#glowGrad2)"/>

  <!-- Disque solaire (couronne) -->
  <circle cx="55" cy="30" r="18" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <circle cx="55" cy="30" r="12" fill="#FFD700" opacity="0.85"/>
  <!-- Rayons de la couronne -->
  <g transform="translate(55,30)">
    <line x1="0" y1="-20" x2="0" y2="-26" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="26" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="-26" y2="0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="26" y2="0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="-14" x2="-18" y2="-18" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="18" y2="-18" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="18" y2="18" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="14" x2="-18" y2="18" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Point central rayonnant -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Silhouette déesse de profil (stylisée) -->
  <!-- Tête -->
  <ellipse cx="55" cy="65" rx="10" ry="12" fill="url(#goddessGold)" opacity="0.9"/>
  <!-- Corps / épaules -->
  <path d="M42,78 Q55,72 68,78 L70,95 Q55,92 40,95 Z" fill="url(#goddessGold)" opacity="0.7"/>
  <!-- Cheveux ondulés -->
  <path d="M45,56 Q38,60 40,72 Q43,68 45,75" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <path d="M65,56 Q72,60 70,72 Q67,68 65,75" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- Drapé -->
  <path d="M42,82 Q36,90 38,100 Q45,108 55,106 Q65,108 72,100 Q74,90 68,82" 
        fill="none" stroke="#F5A623" stroke-width="1.5" opacity="0.6"/>

  <!-- Ornement grec sous la silhouette (méandre) -->
  <path d="M25,108 L25,112 L30,112 L30,108 L35,108 L35,112 L40,112 L40,108 L45,108 L45,112 L50,112 L50,108 L55,108 L55,112 L60,112 L60,108 L65,108 L65,112 L70,112 L70,108 L75,108 L75,112 L80,112 L80,108 L85,108"
        fill="none" stroke="#F5A623" stroke-width="1" opacity="0.5"/>

  <!-- Séparateur vertical -->
  <line x1="105" y1="15" x2="105" y2="105" stroke="#F5A623" stroke-width="0.8" opacity="0.4"/>

  <!-- Texte HELIA  -->
  <text x="120" y="48" font-family="'Times New Roman', Georgia, serif" font-size="36" font-weight="bold"
        fill="url(#goddessGold)" letter-spacing="5">HELIA</text>
  <!-- Ornement ligne avec étoiles -->
  <text x="120" y="63" font-family="Arial" font-size="10" fill="#FFD700" opacity="0.7">✦ ─────────────────── ✦</text>
  <!-- Sous-titre -->
  <text x="120" y="80" font-family="'Times New Roman', serif" font-size="11" fill="#F5A623" letter-spacing="4" font-style="italic">Déesse Solaire Agricole</text>
  <!-- Slogan -->
  <text x="120" y="98" font-family="Arial, sans-serif" font-size="9" fill="#FFD700" opacity="0.6" letter-spacing="1.5">PHOTOVOLTAÏQUE · MYTHOLOGIE · INNOVATION</text>
</svg>
