name: lint-templates

on:
  push:
    paths:
      - 'templates/**'
      - 'tools/check_static_refs.py'
  pull_request:
    paths:
      - 'templates/**'
      - 'tools/check_static_refs.py'

jobs:
  static-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier l'absence de refs /static absolues
        run: python tools/check_static_refs.py
