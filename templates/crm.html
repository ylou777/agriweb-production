<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Prospects - HeliaPV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        /* ===== DARK MINIMAL — CRM PROSPECTS ===== */
        :root {
            --c-bg: #0f1117;
            --c-surface: #1a1d27;
            --c-surface-2: #22252f;
            --c-border: #2a2d3a;
            --c-border-light: #353849;
            --c-text: #e8eaed;
            --c-text-2: #9ba1b0;
            --c-text-3: #6b7185;
            --c-accent: #3b82f6;
            --c-accent-light: rgba(59,130,246,0.1);
            --c-green: #10b981;
            --c-orange: #f59e0b;
            --c-red: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(.4,0,.2,1);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--c-bg);
            min-height: 100vh;
            padding: 24px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--c-text);
            -webkit-font-smoothing: antialiased;
        }

        .container-fluid { max-width: 1600px; }

        /* TOPBAR TITLE */
        h1.text-white {
            color: var(--c-text) !important;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* STAT CARDS */
        .stat-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            color: var(--c-text);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            transition: all var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--c-accent);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card h3 {
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
            color: var(--c-accent);
        }
        .stat-card p {
            margin: 5px 0 0 0;
            color: var(--c-text-2);
            font-size: 0.85rem;
        }

        /* CARDS */
        .card {
            background: var(--c-surface);
            border: 1px solid var(--c-border) !important;
            border-radius: var(--radius);
        }
        .card-header.bg-primary {
            background: var(--c-surface-2) !important;
            border-bottom: 1px solid var(--c-border);
            color: var(--c-text) !important;
        }
        .card-header.bg-primary h5 { color: var(--c-text); }

        /* FILTERS BOX */
        .filters {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .filters .form-label {
            color: var(--c-text-2);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .form-select, .form-control {
            background-color: var(--c-bg);
            border-color: var(--c-border);
            color: var(--c-text);
            font-size: 0.85rem;
        }
        .form-select:focus, .form-control:focus {
            background-color: var(--c-bg);
            border-color: var(--c-accent);
            color: var(--c-text);
            box-shadow: 0 0 0 2px var(--c-accent-light);
        }
        .form-select option { background: var(--c-surface-2); }

        /* TABLE */
        .table {
            color: var(--c-text);
            --bs-table-bg: transparent;
            --bs-table-hover-bg: var(--c-surface-2);
            --bs-table-border-color: var(--c-border);
        }
        .table-light, .table thead.table-light th {
            background: var(--c-surface-2) !important;
            color: var(--c-text-2);
            border-color: var(--c-border);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .table th, .table td { border-color: var(--c-border); }
        .table small { color: var(--c-text-2); }
        .text-muted { color: var(--c-text-3) !important; }
        .text-danger { color: var(--c-red) !important; }

        /* PROSPECT ROW */
        .prospect-row {
            cursor: pointer;
            transition: background-color var(--transition);
        }
        .prospect-row:hover { background-color: var(--c-surface-2) !important; }

        /* BADGES */
        .badge-type-parking  { background-color: #059669; }
        .badge-type-toiture  { background-color: var(--c-accent); }
        .badge-type-friche   { background-color: #6b7280; }
        .badge-statut-nouveau   { background-color: #0ea5e9; }
        .badge-statut-contacte  { background-color: var(--c-orange); color: #111; }
        .badge-statut-qualifie  { background-color: var(--c-green); }
        .badge-statut-perdu     { background-color: var(--c-red); }
        .badge-priorite-haute   { background-color: var(--c-red); }
        .badge-priorite-moyenne { background-color: var(--c-orange); color: #111; }
        .badge-priorite-basse   { background-color: #6b7280; }

        /* BUTTONS */
        .btn-light {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            color: var(--c-text);
        }
        .btn-light:hover {
            background: var(--c-border-light);
            color: var(--c-text);
        }
        .btn-warning { background-color: var(--c-orange); border-color: var(--c-orange); color: #111; }

        /* MODAL */
        .modal-content {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            color: var(--c-text);
        }
        .modal-header {
            border-bottom: 1px solid var(--c-border);
        }
        .modal-header.bg-primary {
            background: var(--c-surface-2) !important;
            color: var(--c-text) !important;
        }
        .modal-header.bg-primary h5 { color: var(--c-text); }
        .modal-header .btn-close-white { filter: invert(0.7); }
        .modal-footer {
            border-top: 1px solid var(--c-border);
        }
        .modal-body .form-label { color: var(--c-text-2); font-size: 0.82rem; }
        .modal-body .form-control[readonly],
        .modal-body textarea[readonly] {
            background: var(--c-bg);
            border-color: var(--c-border);
            color: var(--c-text-2);
        }
        .alert-success {
            background: rgba(16,185,129,0.1);
            border-color: rgba(16,185,129,0.3);
            color: #6ee7b7;
        }
        .alert-primary {
            background: var(--c-accent-light);
            border-color: rgba(59,130,246,0.3);
            color: #93c5fd;
        }

        /* SPINNER */
        .spinner-border.text-primary { color: var(--c-accent) !important; }

        /* MODAL RESPONSIVE */
        .modal-fullscreen-lg { max-width: 90%; }

        .icon-accent { color: var(--c-accent); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border-light); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- En-tête -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>
                <i class="bi bi-building me-2 icon-accent"></i> CRM Prospects
            </h1>
            <div>
                <a href="/api/crm/parametrage" class="btn btn-warning me-2" target="_blank">
                    <i class="bi bi-gear-fill"></i> Paramétrage
                </a>
                <button class="btn btn-light me-2" onclick="exportProspects()">
                    <i class="bi bi-download"></i> Exporter CSV
                </button>
                <a href="/app" class="btn btn-light">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="totalProspects">0</h3>
                    <p>Total Prospects</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="parkingsCount">0</h3>
                    <p>Parkings</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="toituresCount">0</h3>
                    <p>Toitures</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="frichesCount">0</h3>
                    <p>Friches</p>
                </div>
            </div>
        </div>

        <!-- Filtres -->
        <div class="filters">
            <div class="row">
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-funnel"></i> Statut</label>
                    <select id="filterStatut" class="form-select" onchange="loadProspects()">
                        <option value="">Tous</option>
                        <option value="nouveau">Nouveau</option>
                        <option value="contacte">Contacté</option>
                        <option value="qualifie">Qualifié</option>
                        <option value="perdu">Perdu</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-tag"></i> Type</label>
                    <select id="filterType" class="form-select" onchange="loadProspects()">
                        <option value="">Tous</option>
                        <option value="parking">Parking</option>
                        <option value="toiture">Toiture</option>
                        <option value="friche">Friche</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-lightning-charge"></i> Secteur Enedis</label>
                    <select id="filterSecteurEnedis" class="form-select" onchange="loadProspects()">
                        <option value="">Tous</option>
                        <option value="INDUSTRIE">Industrie</option>
                        <option value="TERTIAIRE">Tertiaire</option>
                        <option value="AGRICULTURE">Agriculture</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-bolt"></i> Conso min (MWh)</label>
                    <input type="number" id="filterConsoMin" class="form-control" placeholder="Ex: 100" onchange="loadProspects()">
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-search"></i> Commune</label>
                    <input type="text" id="filterCommune" class="form-control" placeholder="Rechercher..." onkeyup="loadProspects()">
                </div>
                <div class="col-md-2">
                    <label class="form-label"><i class="bi bi-map"></i> Département</label>
                    <input type="text" id="filterDepartement" class="form-control" placeholder="Ex: 29" onkeyup="loadProspects()">
                </div>
            </div>
        </div>

        <!-- Liste des prospects -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-people"></i> Liste des Prospects</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th width="50">#</th>
                                <th>Type</th>
                                <th>Commune</th>
                                <th>Adresse</th>
                                <th>Surface</th>
                                <th>Conso Enedis</th>
                                <th>Secteur</th>
                                <th>Propriétaire</th>
                                <th>BT</th>
                                <th>HTA</th>
                                <th>Statut</th>
                                <th>Priorité</th>
                                <th>Date</th>
                                <th width="150">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="prospectsTable">
                            <tr>
                                <td colspan="14" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Chargement...</span>
                                    </div>
                                    <p class="mt-3 text-muted">Chargement des prospects...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Détails Prospect -->
    <div class="modal fade" id="prospectModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-info-circle"></i> Détails du Prospect</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="prospectDetails">
                    <!-- Contenu dynamique -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" onclick="deleteProspect()">
                        <i class="bi bi-trash"></i> Supprimer
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="button" class="btn btn-primary" onclick="saveProspect()">
                        <i class="bi bi-save"></i> Enregistrer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentProspectId = null;
        let allProspects = [];

        // Charger au démarrage
        window.onload = function() {
            loadStats();
            loadProspects();
        };

        async function loadStats() {
            try {
                const response = await fetch('/api/crm/stats');
                const data = await response.json();
                
                console.log('Stats reçues:', data); // Debug
                
                if (data.success && data.stats) {
                    document.getElementById('totalProspects').textContent = data.stats.total || 0;
                    document.getElementById('parkingsCount').textContent = data.stats.parkings || 0;
                    document.getElementById('toituresCount').textContent = data.stats.toitures || 0;
                    document.getElementById('frichesCount').textContent = data.stats.friches || 0;
                }
            } catch (error) {
                console.error('Erreur chargement stats:', error);
            }
        }

        async function loadProspects() {
            const statut = document.getElementById('filterStatut').value;
            const type = document.getElementById('filterType').value;
            const commune = document.getElementById('filterCommune').value;
            const departement = document.getElementById('filterDepartement').value;
            const secteurEnedis = document.getElementById('filterSecteurEnedis').value;
            const consoMin = document.getElementById('filterConsoMin').value;

            const params = new URLSearchParams();
            if (statut) params.append('statut', statut);
            if (type) params.append('type', type);
            if (commune) params.append('commune', commune);
            if (departement) params.append('departement', departement);
            if (secteurEnedis) params.append('secteur_enedis', secteurEnedis);
            if (consoMin) params.append('conso_min', consoMin);

            try {
                const response = await fetch('/api/crm/prospects?' + params.toString());
                const data = await response.json();

                if (data.success) {
                    allProspects = data.prospects;
                    renderProspects(data.prospects);
                }
            } catch (error) {
                console.error('Erreur chargement prospects:', error);
                document.getElementById('prospectsTable').innerHTML = `
                    <tr>
                        <td colspan="12" class="text-center py-5 text-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            Erreur lors du chargement des prospects
                        </td>
                    </tr>
                `;
            }
        }

        function renderProspects(prospects) {
            const tbody = document.getElementById('prospectsTable');
            
            if (prospects.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="14" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox"></i>
                            <p class="mt-3">Aucun prospect trouvé</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = prospects.map(p => {
                // Badge couleur pour secteur Enedis
                let secteurBadge = '';
                if (p.secteur_enedis) {
                    const secteurColors = {
                        'INDUSTRIE': 'danger',
                        'TERTIAIRE': 'warning',
                        'AGRICULTURE': 'success',
                        'NON_AFFECTE': 'secondary'
                    };
                    const color = secteurColors[p.secteur_enedis] || 'secondary';
                    secteurBadge = `<span class="badge bg-${color}">${p.secteur_enedis}</span>`;
                }
                
                // Indicateur haute consommation
                let consoDisplay = 'N/A';
                if (p.consommation_enedis_mwh) {
                    const conso = Math.round(p.consommation_enedis_mwh);
                    if (conso >= 100) {
                        consoDisplay = `<strong class="text-danger">${conso} MWh ⚡</strong>`;
                    } else {
                        consoDisplay = `${conso} MWh`;
                    }
                }
                
                return `
                <tr class="prospect-row" onclick="showProspectDetails(${p.id})">
                    <td>${p.id}</td>
                    <td><span class="badge badge-type-${p.type}">${p.type}</span></td>
                    <td>${p.commune || 'N/A'}</td>
                    <td><small>${p.adresse || 'Non disponible'}</small></td>
                    <td>${p.surface_m2 ? Math.round(p.surface_m2) + ' m²' : 'N/A'}</td>
                    <td>${consoDisplay}</td>
                    <td>${secteurBadge || '-'}</td>
                    <td><small>${p.proprietaire_siren ? '🏢 ' + (p.proprietaire_denomination || 'N/A').substring(0, 25) + '...' : '-'}</small></td>
                    <td>${p.poste_bt_distance_m ? Math.round(p.poste_bt_distance_m) + ' m' : 'N/A'}</td>
                    <td>${p.poste_hta_distance_m ? Math.round(p.poste_hta_distance_m) + ' m' : 'N/A'}</td>
                    <td><span class="badge badge-statut-${p.statut}">${p.statut}</span></td>
                    <td><span class="badge badge-priorite-${p.priorite}">${p.priorite}</span></td>
                    <td><small>${new Date(p.date_creation).toLocaleDateString('fr-FR')}</small></td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); showProspectDetails(${p.id})">
                            <i class="bi bi-eye"></i>
                        </button>
                        <a href="${p.lien_streetview || '#'}" target="_blank" class="btn btn-sm btn-info" 
                           onclick="event.stopPropagation()" ${!p.lien_streetview ? 'disabled' : ''}>
                            <i class="bi bi-camera"></i>
                        </a>
                        <a href="/chantier/${p.id}" class="btn btn-sm btn-warning" onclick="event.stopPropagation()" title="Suivi chantier">
                            <i class="bi bi-hammer"></i>
                        </a>
                    </td>
                </tr>
            `;
            }).join('');
        }

        async function showProspectDetails(id) {
            currentProspectId = id;
            
            try {
                const response = await fetch(`/api/crm/prospect/${id}`);
                const data = await response.json();

                if (data.success) {
                    const p = data.prospect;
                    const detailsDiv = document.getElementById('prospectDetails');
                    
                    detailsDiv.innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <h6 class="mb-3"><i class="bi bi-geo-alt"></i> Informations Générales</h6>
                                <div class="mb-3">
                                    <label class="form-label">Type</label>
                                    <input type="text" class="form-control" value="${p.type}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Commune</label>
                                    <input type="text" class="form-control" value="${p.commune || ''}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Adresse</label>
                                    <textarea class="form-control" rows="2" readonly>${p.adresse || 'Non disponible'}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Coordonnées GPS</label>
                                    <input type="text" class="form-control" value="${p.latitude}, ${p.longitude}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Surface</label>
                                    <input type="text" class="form-control" value="${p.surface_m2 ? Math.round(p.surface_m2) + ' m² (' + (p.surface_m2/10000).toFixed(2) + ' ha)' : 'N/A'}" readonly>
                                </div>
                                ${p.proprietaire_siren ? `
                                <div class="mb-3">
                                    <h6 class="text-success"><i class="bi bi-building"></i> Propriétaire Cadastral</h6>
                                    <div class="alert alert-success mb-2">
                                        <strong>${p.proprietaire_denomination || 'N/A'}</strong><br>
                                        <small>
                                            SIREN: ${p.proprietaire_siren}<br>
                                            ${p.proprietaire_forme_juridique ? 'Forme juridique: ' + p.proprietaire_forme_juridique : ''}
                                        </small>
                                    </div>
                                </div>
                                ` : ''}
                                
                                ${p.consommation_enedis_mwh ? `
                                <div class="mb-3">
                                    <h6 class="text-primary"><i class="bi bi-lightning-charge"></i> Consommation Électrique Enedis</h6>
                                    <div class="alert alert-primary mb-2">
                                        <div class="row">
                                            <div class="col-6">
                                                <strong class="fs-4">${Math.round(p.consommation_enedis_mwh)} MWh/an</strong>
                                                ${p.consommation_enedis_mwh >= 100 ? '<br><span class="badge bg-danger">⚡ Haute consommation</span>' : ''}
                                            </div>
                                            <div class="col-6">
                                                ${p.secteur_enedis ? `
                                                    <strong>Secteur:</strong><br>
                                                    <span class="badge bg-${p.secteur_enedis === 'INDUSTRIE' ? 'danger' : p.secteur_enedis === 'TERTIAIRE' ? 'warning' : 'success'}">${p.secteur_enedis}</span>
                                                ` : ''}
                                                ${p.nb_sites_enedis ? `<br><small>${p.nb_sites_enedis} site(s)</small>` : ''}
                                            </div>
                                        </div>
                                        <hr>
                                        <small>
                                            <i class="bi bi-graph-up"></i> Potentiel autoconsommation: <strong>${Math.round(p.consommation_enedis_mwh * 0.3)} MWh/an</strong><br>
                                            <i class="bi bi-cash"></i> Économie estimée: <strong>${Math.round(p.consommation_enedis_mwh * 1000 * 0.3 * 0.20).toLocaleString('fr-FR')} €/an</strong>
                                        </small>
                                    </div>
                                </div>
                                ` : ''}
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Distance Poste BT</label>
                                        <input type="text" class="form-control" value="${p.poste_bt_distance_m ? Math.round(p.poste_bt_distance_m) + ' m' : 'N/A'}" readonly>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Distance Poste HTA</label>
                                        <input type="text" class="form-control" value="${p.poste_hta_distance_m ? Math.round(p.poste_hta_distance_m) + ' m' : 'N/A'}" readonly>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <a href="${p.lien_streetview}" target="_blank" class="btn btn-info me-2" ${!p.lien_streetview ? 'disabled' : ''}>
                                        <i class="bi bi-camera"></i> Street View
                                    </a>
                                    <a href="${p.lien_annuaire}" target="_blank" class="btn btn-warning" ${!p.lien_annuaire ? 'disabled' : ''}>
                                        <i class="bi bi-book"></i> Pages Jaunes
                                    </a>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h6 class="mb-3"><i class="bi bi-person"></i> Gestion Prospect</h6>
                                <div class="mb-3">
                                    <label class="form-label">Statut</label>
                                    <select id="editStatut" class="form-select">
                                        <option value="nouveau" ${p.statut === 'nouveau' ? 'selected' : ''}>Nouveau</option>
                                        <option value="contacte" ${p.statut === 'contacte' ? 'selected' : ''}>Contacté</option>
                                        <option value="qualifie" ${p.statut === 'qualifie' ? 'selected' : ''}>Qualifié</option>
                                        <option value="perdu" ${p.statut === 'perdu' ? 'selected' : ''}>Perdu</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Priorité</label>
                                    <select id="editPriorite" class="form-select">
                                        <option value="haute" ${p.priorite === 'haute' ? 'selected' : ''}>Haute</option>
                                        <option value="moyenne" ${p.priorite === 'moyenne' ? 'selected' : ''}>Moyenne</option>
                                        <option value="basse" ${p.priorite === 'basse' ? 'selected' : ''}>Basse</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Nom du Contact</label>
                                    <input type="text" id="editContactNom" class="form-control" value="${p.contact_nom || ''}" placeholder="Nom du propriétaire/gestionnaire">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email du Contact</label>
                                    <input type="email" id="editContactEmail" class="form-control" value="${p.contact_email || ''}" placeholder="email@example.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Téléphone du Contact</label>
                                    <input type="tel" id="editContactTelephone" class="form-control" value="${p.contact_telephone || ''}" placeholder="06 12 34 56 78">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Notes</label>
                                    <textarea id="editNotes" class="form-control" rows="5" placeholder="Notes sur le prospect...">${p.notes || ''}</textarea>
                                </div>
                                <div class="text-muted">
                                    <small>
                                        <i class="bi bi-calendar"></i> Créé le ${new Date(p.date_creation).toLocaleString('fr-FR')}<br>
                                        <i class="bi bi-pencil"></i> Modifié le ${new Date(p.date_modification).toLocaleString('fr-FR')}
                                    </small>
                                </div>
                            </div>
                        </div>
                    `;

                    const modal = new bootstrap.Modal(document.getElementById('prospectModal'));
                    modal.show();
                }
            } catch (error) {
                console.error('Erreur chargement détails:', error);
                alert('❌ Erreur lors du chargement des détails');
            }
        }

        async function saveProspect() {
            if (!currentProspectId) return;

            const updateData = {
                statut: document.getElementById('editStatut').value,
                priorite: document.getElementById('editPriorite').value,
                notes: document.getElementById('editNotes').value,
                contact_nom: document.getElementById('editContactNom').value,
                contact_email: document.getElementById('editContactEmail').value,
                contact_telephone: document.getElementById('editContactTelephone').value
            };

            try {
                const response = await fetch(`/api/crm/prospect/${currentProspectId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Prospect mis à jour avec succès');
                    bootstrap.Modal.getInstance(document.getElementById('prospectModal')).hide();
                    loadProspects();
                    loadStats();
                } else {
                    alert('❌ Erreur lors de la mise à jour');
                }
            } catch (error) {
                console.error('Erreur sauvegarde:', error);
                alert('❌ Erreur de connexion');
            }
        }

        async function deleteProspect() {
            if (!currentProspectId) return;

            if (!confirm('⚠️ Êtes-vous sûr de vouloir supprimer ce prospect ?')) {
                return;
            }

            try {
                const response = await fetch(`/api/crm/prospect/${currentProspectId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ Prospect supprimé');
                    bootstrap.Modal.getInstance(document.getElementById('prospectModal')).hide();
                    loadProspects();
                    loadStats();
                } else {
                    alert('❌ Erreur lors de la suppression');
                }
            } catch (error) {
                console.error('Erreur suppression:', error);
                alert('❌ Erreur de connexion');
            }
        }

        function exportProspects() {
            // Générer CSV
            const csv = ['ID,Type,Commune,Département,Adresse,Surface (m²),BT (m),HTA (m),Statut,Priorité,Contact,Email,Téléphone,Notes,Date'];
            
            allProspects.forEach(p => {
                csv.push([
                    p.id,
                    p.type,
                    p.commune || '',
                    p.departement || '',
                    (p.adresse || '').replace(/,/g, ' '),
                    p.surface_m2 || '',
                    p.poste_bt_distance_m || '',
                    p.poste_hta_distance_m || '',
                    p.statut,
                    p.priorite,
                    p.contact_nom || '',
                    p.contact_email || '',
                    p.contact_telephone || '',
                    (p.notes || '').replace(/,/g, ' '),
                    new Date(p.date_creation).toLocaleDateString('fr-FR')
                ].join(','));
            });

            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prospects_HeliaPV_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }
    </script>
</body>
</html>
