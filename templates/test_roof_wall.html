<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Projection LiDAR → Murs</title>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<style>
body{margin:0;overflow:hidden;background:#1a1a2e;font-family:monospace}
canvas{display:block}
#info{position:absolute;top:10px;left:10px;color:#0f0;background:rgba(0,0,0,.8);
  padding:12px;border-radius:6px;font-size:12px;max-width:520px;
  max-height:85vh;overflow-y:auto;white-space:pre-wrap;z-index:10}
#controls{position:absolute;top:10px;right:10px;color:#fff;background:rgba(0,0,0,.8);
  padding:12px;border-radius:6px;font-size:13px;z-index:10}
#controls label{display:block;margin:3px 0;cursor:pointer}
#status{position:absolute;bottom:10px;left:10px;color:#ff0;background:rgba(0,0,0,.8);
  padding:8px;border-radius:6px;font-size:14px;z-index:10}
</style>
</head>
<body>
<div id="info">En attente...</div>
<div id="controls">
  <b>Affichage :</b>
  <label><input type="checkbox" id="chkWalls" checked> Murs (skirt)</label>
  <label><input type="checkbox" id="chkWallTop" checked> Arête haute murs (rouge)</label>
  <label><input type="checkbox" id="chkRoof" checked> Toit solide</label>
  <label><input type="checkbox" id="chkWire" checked> Toit wireframe</label>
  <label><input type="checkbox" id="chkPts"> Points grille colorés</label>
  <label><input type="checkbox" id="chkFp"> Footprint fp (vert)</label>
  <label><input type="checkbox" id="chkFpExp"> Footprint élargi (jaune)</label>
</div>
<div id="status">Chargement automatique...</div>

<script>
const LAT_TO_M = 111320;
let scene, camera, renderer;
let groups = {};

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dl = new THREE.DirectionalLight(0xffffff, 0.8);
    dl.position.set(20, 40, 20); scene.add(dl);
    scene.add(new THREE.GridHelper(100, 100, 0x444444, 0x333333));
    scene.add(new THREE.AxesHelper(5));
    setupOrbit();
    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    (function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
}

function setupOrbit() {
    let drag=false, right=false, px, py;
    let theta=Math.PI/4, phi=Math.PI/4, radius=60;
    let target=new THREE.Vector3(0,5,0);
    function upd(){
        camera.position.set(
            target.x+radius*Math.sin(phi)*Math.cos(theta),
            target.y+radius*Math.cos(phi),
            target.z+radius*Math.sin(phi)*Math.sin(theta));
        camera.lookAt(target);
    }
    upd();
    const c=renderer.domElement;
    c.addEventListener('mousedown',e=>{drag=true;right=e.button===2;px=e.clientX;py=e.clientY});
    c.addEventListener('mousemove',e=>{
        if(!drag)return;
        const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
        if(right){
            const r=new THREE.Vector3().subVectors(camera.position,target).cross(camera.up).normalize();
            target.addScaledVector(r,-dx*0.05);
            target.addScaledVector(camera.up,dy*0.05);
        } else { theta-=dx*0.005; phi=Math.max(0.1,Math.min(Math.PI-0.1,phi-dy*0.005)); }
        upd();
    });
    addEventListener('mouseup',()=>drag=false);
    c.addEventListener('wheel',e=>{radius=Math.max(5,Math.min(300,radius+e.deltaY*0.05));upd()});
    c.addEventListener('contextmenu',e=>e.preventDefault());
}

function pip(px,py,poly){
    let ins=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
        if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi) ins=!ins;
    }
    return ins;
}
function distFp(px,py,fp){
    let m=Infinity;
    for(let k=0;k<fp.length;k++){
        const k1=(k+1)%fp.length;
        const ax=fp[k][0],ay=fp[k][1],bx=fp[k1][0],by=fp[k1][1];
        const ex=bx-ax,ey=by-ay,ab2=ex*ex+ey*ey;
        let t=ab2>0?((px-ax)*ex+(py-ay)*ey)/ab2:0;
        t=Math.max(0,Math.min(1,t));
        const dx=px-(ax+t*ex),dy=py-(ay+t*ey);
        m=Math.min(m,Math.sqrt(dx*dx+dy*dy));
    }
    return m;
}
function expandPoly(poly,d){
    const n=poly.length; if(n<3)return poly;
    let area=0;
    for(let i=0,j=n-1;i<n;j=i++) area+=poly[j][0]*poly[i][1]-poly[i][0]*poly[j][1];
    const sign=area>0?1:-1;
    const lines=[];
    for(let i=0;i<n;i++){
        const[x1,y1]=poly[i],[x2,y2]=poly[(i+1)%n];
        const ex=x2-x1,ey=y2-y1,len=Math.sqrt(ex*ex+ey*ey)||1;
        lines.push({x1:x1-ey/len*sign*d,y1:y1+ex/len*sign*d,x2:x2-ey/len*sign*d,y2:y2+ex/len*sign*d});
    }
    const res=[];
    for(let i=0;i<n;i++){
        const a=lines[(i+n-1)%n],b=lines[i];
        const dx1=a.x2-a.x1,dy1=a.y2-a.y1,dx2=b.x2-b.x1,dy2=b.y2-b.y1;
        const den=dx1*dy2-dy1*dx2;
        if(Math.abs(den)<1e-10){res.push([b.x1,b.y1]);continue;}
        const t=((b.x1-a.x1)*dy2-(b.y1-a.y1)*dx2)/den;
        res.push([a.x1+t*dx1,a.y1+t*dy1]);
    }
    return res;
}

function clearGroup(k){if(groups[k]){scene.remove(groups[k]);groups[k]=null;}}
function addGroup(k,g){groups[k]=g;scene.add(g);}

async function loadData() {
    const info=document.getElementById('info');
    const status=document.getElementById('status');
    
    // Step 1: get building data
    info.textContent='⏳ Chargement 3d-data...\n';
    const lat=47.212772, lon=2.0991783;
    let bldgCoords, bh;
    try {
        const r=await fetch(`/api/lidar/3d-data?lat=${lat}&lon=${lon}&radius=60`);
        const d=await r.json();
        if(!d.buildings_bdtopo?.length) throw new Error('No buildings');
        // Pick closest building to center
        let best=null,bestD=Infinity;
        for(const b of d.buildings_bdtopo){
            if(!b.coords?.length)continue;
            const cx=b.coords.reduce((s,c)=>s+c[0],0)/b.coords.length;
            const cy=b.coords.reduce((s,c)=>s+c[1],0)/b.coords.length;
            const dist=Math.sqrt((cx-lon)**2+(cy-lat)**2);
            if(dist<bestD){bestD=dist;best=b;}
        }
        bldgCoords=best.coords;
        bh=Math.max(best.hauteur||best.height_eave||best.height||6, 2);
        info.textContent+=`✅ Bâtiment: ${bldgCoords.length} pts, bh=${bh}m\n`;
    } catch(e){info.textContent+=`❌ ${e.message}`;return;}
    
    // Step 2: call COPC grid
    info.textContent+='⏳ Appel COPC grid...\n';
    status.textContent='⏳ COPC grid (~20s)...';
    let gd;
    try {
        const r=await fetch('/api/lidar/copc-grid',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({lat,lon,building_coords:bldgCoords,step:0.5,wall_h:bh,include_planes:false}),
            signal:AbortSignal.timeout(90000),
        });
        gd=await r.json();
        if(!gd.success) throw new Error(gd.error);
        info.textContent+=`✅ COPC: ${gd.nb_points}pts, ${gd.nx}×${gd.ny}, cov=${gd.coverage_pct}%\n`;
    } catch(e){info.textContent+=`❌ COPC: ${e.message}`;status.textContent='❌';return;}
    
    status.textContent='✅ Construction scène...';
    buildScene(gd, bldgCoords, bh, lat, lon);
    status.textContent='✅ Done';
}

function buildScene(gridData, buildingCoords, bh, lat, lon) {
    const {grid,x0,y0,nx,ny,step,z_baseline_rel}=gridData;
    const bc=gridData.center;
    const LNG=LAT_TO_M*Math.cos(bc.lat*Math.PI/180);
    const info=document.getElementById('info');
    
    // Footprint local
    let fp=buildingCoords.map(([lo,la])=>[(lo-bc.lon)*LNG,(la-bc.lat)*LAT_TO_M]);
    if(fp.length>3){const[a,b]=fp[0],[c,d]=fp[fp.length-1];if((a-c)**2+(b-d)**2<0.01)fp.pop();}
    
    const FP_MARGIN=step*3, EDGE_FLAT=step*1.0, EDGE_RAMP=step*3.0;
    const fpExp=expandPoly(fp,FP_MARGIN);
    const SUB=2, subStep=step/SUB;
    const snx=(nx-1)*SUB+1, sny=(ny-1)*SUB+1;
    
    // Null-fill + coarseZ
    const cZ=new Float32Array(ny*nx);
    for(let iy=0;iy<ny;iy++) for(let ix=0;ix<nx;ix++){
        let z=grid[iy]?.[ix];
        if(z===null||z===undefined){
            let best=null,bd=Infinity;
            for(let dy=-8;dy<=8;dy++) for(let dx=-8;dx<=8;dx++){
                if(!dy&&!dx)continue;
                const nv=grid[iy+dy]?.[ix+dx];
                if(nv===null||nv===undefined)continue;
                const d2=dx*dx+dy*dy;
                if(d2<bd){best=nv;bd=d2;}
            }
            z=best!==null?best:z_baseline_rel;
        }
        cZ[iy*nx+ix]=z;
    }
    const subZ=(sy,sx)=>{
        const fy=sy/SUB,fx=sx/SUB;
        const iy=Math.min(Math.floor(fy),ny-2),ix=Math.min(Math.floor(fx),nx-2);
        const ty=fy-iy,tx=fx-ix;
        return cZ[iy*nx+ix]*(1-tx)*(1-ty)+cZ[iy*nx+ix+1]*tx*(1-ty)
              +cZ[(iy+1)*nx+ix]*(1-tx)*ty+cZ[(iy+1)*nx+ix+1]*tx*ty;
    };
    
    // Clear
    for(const k of Object.keys(groups)) clearGroup(k);
    
    // ═════════════════════════════════════════════════════════════
    // DIAGNOSTIC: Compute roof vertices with zone info
    // ═════════════════════════════════════════════════════════════
    const allVerts=[];  // {gx,gy,mnh,lidarMnh,zone,dist,insideFP}
    for(let sy=0;sy<sny;sy++) for(let sx=0;sx<snx;sx++){
        const gx=x0+sx*subStep, gy=y0+sy*subStep;
        if(!pip(gx,gy,fpExp))continue;
        const ins=pip(gx,gy,fp);
        const z_rel=subZ(sy,sx);
        const lidarMnh=Math.max(bh,z_rel-z_baseline_rel+bh);
        let mnh, zone, d=ins?distFp(gx,gy,fp):-distFp(gx,gy,fp);
        if(!ins){mnh=bh;zone='outside';}
        else if(d<EDGE_FLAT){mnh=bh;zone='flat';}
        else if(d<EDGE_RAMP){const t=(d-EDGE_FLAT)/(EDGE_RAMP-EDGE_FLAT);mnh=bh+t*(lidarMnh-bh);zone='ramp';}
        else{mnh=lidarMnh;zone='inside';}
        allVerts.push({gx,gy,mnh,lidarMnh,zone,dist:d,insideFP:ins,sx,sy});
    }
    
    // Stats per zone
    const zones={outside:[], flat:[], ramp:[], inside:[]};
    for(const v of allVerts) zones[v.zone].push(v);
    
    info.textContent+=`\n━━━ ZONES ━━━\n`;
    info.textContent+=`EDGE_FLAT = ${EDGE_FLAT}m (0→${EDGE_FLAT}m du bord)\n`;
    info.textContent+=`EDGE_RAMP = ${EDGE_RAMP}m (${EDGE_FLAT}→${EDGE_RAMP}m du bord)\n`;
    info.textContent+=`bh = ${bh}m, z_baseline = ${z_baseline_rel?.toFixed(3)}\n\n`;
    
    for(const[name,verts] of Object.entries(zones)){
        const mnhs=verts.map(v=>v.mnh);
        const dists=verts.map(v=>v.dist);
        info.textContent+=`${name}: ${verts.length} pts\n`;
        if(verts.length){
            info.textContent+=`  mnh: [${Math.min(...mnhs).toFixed(2)}, ${Math.max(...mnhs).toFixed(2)}]\n`;
            info.textContent+=`  dist: [${Math.min(...dists).toFixed(3)}, ${Math.max(...dists).toFixed(3)}]\n`;
        }
    }
    
    // Key diagnostic: what is the actual height difference at the roof-wall junction?
    info.textContent+=`\n━━━ JONCTION TOIT-MUR ━━━\n`;
    info.textContent+=`Haut des murs (skirt hTop) = bh = ${bh}m\n`;
    
    // Vertices in RAMP zone closest to the boundary
    const rampSorted=[...zones.ramp].sort((a,b)=>a.dist-b.dist);
    info.textContent+=`\nVertices RAMP les plus proches du bord:\n`;
    for(const v of rampSorted.slice(0,15)){
        const delta=(v.mnh-bh).toFixed(3);
        info.textContent+=`  d=${v.dist.toFixed(3)}m → mnh=${v.mnh.toFixed(3)} (bh+${delta}) lidar=${v.lidarMnh.toFixed(2)}\n`;
    }
    
    // FLAT zone
    info.textContent+=`\nVertices FLAT (tous devraient être à bh=${bh}):\n`;
    const flatNotBh=zones.flat.filter(v=>Math.abs(v.mnh-bh)>0.001);
    info.textContent+=`  Total: ${zones.flat.length}, pas à bh: ${flatNotBh.length}\n`;
    
    // KEY FINDING: the first RAMP vertex (closest to boundary) has mnh > bh
    // This means triangles between FLAT and RAMP vertices create a slope
    // But the wall top is at bh → GAP between wall top and ramp start
    if(rampSorted.length>0){
        const firstRamp=rampSorted[0];
        const gap=firstRamp.mnh-bh;
        info.textContent+=`\n⚡ PREMIER VERTEX RAMP: d=${firstRamp.dist.toFixed(3)}m, `;
        info.textContent+=`mnh=${firstRamp.mnh.toFixed(3)}, gap=${gap.toFixed(3)}m\n`;
        if(gap>0.1) info.textContent+=`⚠️ GAP > 10cm → VISIBLE SUR LE SCREENSHOT!\n`;
        else info.textContent+=`✅ Gap < 10cm\n`;
    }
    
    // What does the triangle look like at the boundary?
    // A clip point on the fp boundary has z=bh. The nearest INSIDE vertex 
    // is in FLAT zone if d < EDGE_FLAT, or RAMP zone if d > EDGE_FLAT.
    // Since the sub-grid step is 0.25m and EDGE_FLAT=0.5m, the nearest 
    // interior vertex is at most 0.25*sqrt(2)≈0.35m from the nearest grid line.
    // But its distance to the fp boundary could be more than 0.5m depending
    // on where the boundary cuts through the grid.
    
    info.textContent+=`\n━━━ ANALYSE TRIANGLES FRONTIÈRE ━━━\n`;
    // Find vertices that are INSIDE fp, close to boundary, but in RAMP zone
    const problematic=zones.ramp.filter(v=>v.dist<EDGE_RAMP && v.dist>=EDGE_FLAT);
    const nearBoundRamp=problematic.filter(v=>v.dist<1.0); // within 1m
    info.textContent+=`Vertices RAMP < 1m du bord: ${nearBoundRamp.length}\n`;
    if(nearBoundRamp.length>0){
        const avgGap=nearBoundRamp.reduce((s,v)=>s+(v.mnh-bh),0)/nearBoundRamp.length;
        info.textContent+=`Gap moyen: ${avgGap.toFixed(3)}m\n`;
        info.textContent+=`Gap max: ${Math.max(...nearBoundRamp.map(v=>v.mnh-bh)).toFixed(3)}m\n`;
    }
    
    // ═════════════════════════════════════════════════════════════
    // RENDER: Walls
    // ═════════════════════════════════════════════════════════════
    {
        const g=new THREE.Group();
        const pos=[];
        for(let i=0;i<fp.length;i++){
            const[px0,py0]=fp[i],[px1,py1]=fp[(i+1)%fp.length];
            pos.push(px0,0,-py0, px1,0,-py1, px1,bh,-py1, px0,bh,-py0);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
        const idx=[];
        for(let q=0;q<pos.length/12;q++){const b=q*4;idx.push(b,b+1,b+2,b,b+2,b+3);}
        geo.setIndex(idx); geo.computeVertexNormals();
        g.add(new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0xD0C8B8,side:THREE.DoubleSide})));
        addGroup('walls',g);
    }
    
    // Wall top edge (RED line)
    {
        const g=new THREE.Group();
        const pts=[];
        for(let i=0;i<=fp.length;i++){const[px,py]=fp[i%fp.length];pts.push(new THREE.Vector3(px,bh,-py));}
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({color:0xff0000})));
        addGroup('wallTop',g);
    }
    
    // ═════════════════════════════════════════════════════════════
    // RENDER: Roof mesh (with clipping, identical to _buildRoofFromGrid)
    // ═════════════════════════════════════════════════════════════
    {
        const positions=[], vertexMap=new Int32Array(snx*sny).fill(-1);
        let vi=0;
        for(const v of allVerts){
            positions.push(v.gx, v.mnh, -v.gy);
            vertexMap[v.sy*snx+v.sx]=vi++;
        }
        
        const faces=[];
        for(let sy=0;sy<sny-1;sy++) for(let sx=0;sx<snx-1;sx++){
            const v00=vertexMap[sy*snx+sx],v10=vertexMap[sy*snx+sx+1];
            const v01=vertexMap[(sy+1)*snx+sx],v11=vertexMap[(sy+1)*snx+sx+1];
            const n=[v00,v10,v01,v11].filter(v=>v>=0).length;
            if(n<3)continue;
            if(n===4){
                const y00=positions[v00*3+1],y10=positions[v10*3+1],y01=positions[v01*3+1],y11=positions[v11*3+1];
                if(Math.abs(y00-y11)<=Math.abs(y10-y01)) faces.push(v00,v10,v11,v00,v11,v01);
                else faces.push(v00,v10,v01,v10,v11,v01);
            } else {
                if(v00>=0&&v10>=0&&v01>=0)faces.push(v00,v10,v01);
                else if(v00>=0&&v10>=0&&v11>=0)faces.push(v00,v10,v11);
                else if(v00>=0&&v01>=0&&v11>=0)faces.push(v00,v11,v01);
                else if(v10>=0&&v01>=0&&v11>=0)faces.push(v10,v11,v01);
            }
        }
        
        // Clipping
        const segHits=(a,b)=>{
            const dx=b.x-a.x,dy=b.y-a.y,hits=[];
            for(let k=0;k<fp.length;k++){
                const k1=(k+1)%fp.length;
                const ex=fp[k][0],ey=fp[k][1],fx=fp[k1][0],fy=fp[k1][1];
                const edx=fx-ex,edy=fy-ey,den=dx*edy-dy*edx;
                if(Math.abs(den)<1e-12)continue;
                const t=((ex-a.x)*edy-(ey-a.y)*edx)/den;
                const s=((ex-a.x)*dy-(ey-a.y)*dx)/den;
                if(t<-1e-9||t>1+1e-9||s<-1e-9||s>1+1e-9)continue;
                hits.push(Math.max(0,Math.min(1,t)));
            }
            return hits.sort((a,b)=>a-b);
        };
        const lerp=(a,b,t)=>({x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y),z:bh});
        
        const cP=[],cF=[];
        for(let fi=0;fi<faces.length;fi+=3){
            const vI=[faces[fi],faces[fi+1],faces[fi+2]];
            const tri=vI.map(i=>({x:positions[i*3],y:-positions[i*3+2],z:positions[i*3+1]}));
            const ins=tri.map(v=>pip(v.x,v.y,fp));
            const nIn=ins.filter(Boolean).length;
            if(nIn===0)continue;
            let poly;
            if(nIn===3){poly=tri;}
            else{
                poly=[];
                for(let i=0;i<3;i++){
                    const j=(i+1)%3;
                    if(ins[i])poly.push(tri[i]);
                    if(ins[i]!==ins[j]){
                        const h=segHits(tri[i],tri[j]);
                        if(h.length>0)poly.push(lerp(tri[i],tri[j],ins[i]?h[0]:h[h.length-1]));
                    } else if(!ins[i]&&!ins[j]){
                        const h=segHits(tri[i],tri[j]);
                        for(let k=0;k+1<h.length;k+=2){poly.push(lerp(tri[i],tri[j],h[k]));poly.push(lerp(tri[i],tri[j],h[k+1]));}
                    }
                }
                if(poly.length<3)continue;
            }
            const off=cP.length/3;
            for(const v of poly) cP.push(v.x,v.z,-v.y);
            for(let j=1;j<poly.length-1;j++) cF.push(off,off+j,off+j+1);
        }
        
        if(cP.length>=9){
            const geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.Float32BufferAttribute(cP,3));
            geo.setIndex(cF); geo.computeVertexNormals();
            
            const g=new THREE.Group();
            g.add(new THREE.Mesh(geo,new THREE.MeshPhongMaterial({
                color:0x4488ff,transparent:true,opacity:0.6,side:THREE.DoubleSide,depthWrite:false})));
            addGroup('roof',g);
            
            const wg=new THREE.Group();
            wg.add(new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true})));
            addGroup('wire',wg);
            
            // DIAGNOSTIC: find vertices on fp boundary
            info.textContent+=`\n━━━ VERTICES CLIPPÉS SUR BORD ━━━\n`;
            let nEdge=0, nAtBh=0, nAbove=0, maxGap=0;
            for(let i=0;i<cP.length;i+=3){
                const d=distFp(cP[i],-cP[i+2],fp);
                if(d<0.05){
                    nEdge++;
                    const diff=cP[i+1]-bh;
                    if(Math.abs(diff)<0.01)nAtBh++;
                    else{nAbove++;maxGap=Math.max(maxGap,diff);}
                }
            }
            info.textContent+=`Sur bord (<5cm): ${nEdge} total\n`;
            info.textContent+=`  À bh: ${nAtBh}\n`;
            info.textContent+=`  Au-dessus: ${nAbove} (max gap: ${maxGap.toFixed(3)}m)\n`;
            
            // Vertices NOT on boundary but closest to it (first ring)
            info.textContent+=`\n━━━ PREMIÈRE COURONNE INTÉRIEURE ━━━\n`;
            let ring=[];
            for(let i=0;i<cP.length;i+=3){
                const d=distFp(cP[i],-cP[i+2],fp);
                if(d>=0.05 && d<0.6) ring.push({d,y:cP[i+1],gap:cP[i+1]-bh});
            }
            ring.sort((a,b)=>a.d-b.d);
            for(const v of ring.slice(0,15)){
                info.textContent+=`  d=${v.d.toFixed(3)}m, y=${v.y.toFixed(3)}, gap=${v.gap.toFixed(3)}m\n`;
            }
            if(ring.filter(v=>v.gap>0.1).length>0){
                info.textContent+=`\n⚠️ CAUSE DU GAP IDENTIFIÉE:\n`;
                info.textContent+=`  Des triangles 100% inside (nIn=3) dans la zone RAMP\n`;
                info.textContent+=`  ont mnh > bh mais les murs s'arrêtent à bh.\n`;
                info.textContent+=`  → Les triangles "dépassent" au-dessus des murs.\n`;
                info.textContent+=`  FIX: Augmenter EDGE_FLAT ou monter les murs.\n`;
            }
        }
    }
    
    // Points colorés
    {
        const g=new THREE.Group();
        const colors={outside:0x888888,flat:0x00ff00,ramp:0xffaa00,inside:0x0088ff};
        for(const v of allVerts){
            const s=new THREE.Mesh(new THREE.SphereGeometry(0.1,4,4),new THREE.MeshBasicMaterial({color:colors[v.zone]}));
            s.position.set(v.gx,v.mnh,-v.gy);
            g.add(s);
        }
        addGroup('pts',g); g.visible=false;
    }
    
    // Footprint lines
    {
        const g=new THREE.Group();
        const pts=fp.map(([x,y])=>new THREE.Vector3(x,bh+0.1,-y));
        pts.push(pts[0].clone());
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x00ff00})));
        addGroup('fp',g); g.visible=false;
    }
    {
        const g=new THREE.Group();
        const pts=fpExp.map(([x,y])=>new THREE.Vector3(x,bh+0.2,-y));
        pts.push(pts[0].clone());
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffff00})));
        addGroup('fpExp',g); g.visible=false;
    }
    
    // Bind checkboxes
    const bind=(id,k)=>{const el=document.getElementById(id);el.onchange=()=>{if(groups[k])groups[k].visible=el.checked;};if(groups[k])groups[k].visible=el.checked;};
    bind('chkWalls','walls'); bind('chkWallTop','wallTop'); bind('chkRoof','roof');
    bind('chkWire','wire'); bind('chkPts','pts'); bind('chkFp','fp'); bind('chkFpExp','fpExp');
}

init();
loadData();
</script>
</body>
</html>
