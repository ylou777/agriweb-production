<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriWeb</title>
  <!-- Polices et styles externes -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="static/advanced_layer_control.css">
  <!-- Autocomplétion adresses et communes -->
  <link rel="stylesheet" href="{{ url_for('static', filename='autocomplete.css') }}">
  <style>
    /* ===== DARK MINIMAL DESIGN ===== */
    :root {
      --sidebar-w: 360px;
      --c-bg: #0f1117;
      --c-surface: #1a1d27;
      --c-surface-2: #22252f;
      --c-border: #2a2d3a;
      --c-border-light: #353849;
      --c-text: #e8eaed;
      --c-text-secondary: #9ba1b0;
      --c-text-3: #6b7185;
      --c-accent: #3b82f6;
      --c-accent-light: rgba(59,130,246,0.1);
      --c-success: #10b981;
      --c-danger: #ef4444;
      --c-orange: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      min-height: 100vh;
    }
    body {
      margin: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: var(--c-text);
      background: var(--c-bg);
    }

    /* === LAYOUT === */
    .main-container {
      flex: 1 1 0;
      display: flex !important;
      flex-direction: row !important;
      min-height: 0;
      height: 100vh;
      overflow: hidden;
      align-items: stretch;
      position: relative;
    }

    /* === SIDEBAR === */
    #sidebar {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: var(--sidebar-w) !important;
      min-width: var(--sidebar-w) !important;
      max-width: var(--sidebar-w) !important;
      height: 100% !important;
      overflow-y: auto;
      background: var(--c-surface) !important;
      z-index: 10 !important;
      border-right: 1px solid var(--c-border);
      display: flex !important;
      flex-direction: column !important;
      flex-shrink: 0 !important;
      flex-grow: 0 !important;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--c-border-light); border-radius: 4px; }

    /* === SIDEBAR HEADER === */
    .sidebar-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .sidebar-brand {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--c-text);
      flex-grow: 1;
    }
    .sidebar-brand span {
      color: var(--c-accent);
    }

    /* === NAVIGATION PILLS === */
    .nav-pills-row {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--c-text-secondary);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 20px;
      text-decoration: none;
      transition: all var(--transition);
      white-space: nowrap;
      cursor: pointer;
    }
    .nav-pill:hover {
      color: var(--c-accent);
      border-color: var(--c-accent);
      background: var(--c-accent-light);
      transform: translateY(-1px);
    }
    .nav-pill i { font-size: 0.85rem; }
    .nav-pill.pill-danger:hover {
      color: var(--c-danger);
      border-color: var(--c-danger);
      background: rgba(239,68,68,0.1);
    }

    /* === ACCORDION FLAT === */
    .accordion { --bs-accordion-border-color: transparent; }
    .accordion-item {
      border: none !important;
      background: transparent;
    }
    .accordion-button {
      padding: 14px 24px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--c-text);
      background: transparent !important;
      border: none;
      box-shadow: none !important;
      border-bottom: 1px solid var(--c-border);
      border-radius: 0 !important;
      transition: all var(--transition);
      gap: 10px;
    }
    .accordion-button:hover {
      background: var(--c-bg) !important;
    }
    .accordion-button:not(.collapsed) {
      color: var(--c-accent);
      background: var(--c-accent-light) !important;
      border-bottom-color: var(--c-accent);
    }
    .accordion-button::after {
      width: 14px;
      height: 14px;
      background-size: 14px;
      opacity: 0.4;
      transition: transform var(--transition), opacity var(--transition);
      filter: invert(1);
    }
    .accordion-button:not(.collapsed)::after {
      opacity: 0.8;
    }
    .accordion-button i, .accordion-button .bi {
      font-size: 1rem;
      opacity: 0.7;
    }
    .accordion-button:not(.collapsed) i,
    .accordion-button:not(.collapsed) .bi {
      opacity: 1;
    }
    .accordion-collapse {
      transition: height 0.25s ease;
    }
    .accordion-body {
      padding: 16px 24px 20px;
      background: var(--c-bg);
    }

    /* === FORM CONTROLS FLAT === */
    .form-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--c-text-secondary);
      margin-bottom: 4px;
      letter-spacing: 0.01em;
    }
    .form-control, .form-select {
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      padding: 8px 12px;
      transition: border-color var(--transition), box-shadow var(--transition);
      background: var(--c-surface-2);
      color: var(--c-text);
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background: var(--c-surface-2);
      color: var(--c-text);
    }
    .form-control::placeholder { color: var(--c-text-3); }
    .form-range::-webkit-slider-thumb {
      background: var(--c-accent);
    }
    .form-range::-webkit-slider-runnable-track {
      background: var(--c-border);
    }

    /* === BUTTONS FLAT === */
    .accordion-body .btn {
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 9px 16px;
      transition: all var(--transition);
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background: var(--c-accent);
      border-color: var(--c-accent);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }
    .btn-warning {
      background: var(--c-orange);
      border-color: var(--c-orange);
      color: #fff;
    }
    .btn-warning:hover {
      background: #b45309;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245,158,11,0.25);
    }
    .btn-secondary {
      background: var(--c-surface-2);
      border-color: var(--c-border);
      color: var(--c-text-secondary);
    }

    /* === CARDS (filtres commune) === */
    .accordion-body .card {
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: none;
      background: var(--c-surface);
    }
    .accordion-body .card-header {
      background: transparent;
      border-bottom: 1px solid var(--c-border);
      padding: 10px 14px;
    }
    .accordion-body .card-body {
      padding: 12px 14px;
    }

    /* === SLIDER VALUE BADGE === */
    .slider-value {
      font-weight: 600;
      color: var(--c-accent);
      font-size: 0.82rem;
    }

    /* === LOG AREAS === */
    pre {
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      height: 200px;
      overflow: auto;
      font-size: 0.78rem;
      color: var(--c-text-secondary);
    }
    #searchLog {
      border-radius: var(--radius-sm) !important;
      font-size: 0.8rem !important;
    }

    /* === MISC === */
    .layer-list { list-style: none; padding-left: 0; margin: 0 0 1em 0; }
    .layer-list li { display: flex; align-items: center; margin-bottom: 5px; }
    .layer-color { width: 14px; height: 14px; display: inline-block; border-radius: 4px; margin-right: 8px; border: 1px solid var(--c-border); }

    /* === MAP === */
    #mapFrame {
      position: absolute !important;
      left: var(--sidebar-w) !important;
      top: 0 !important;
      width: calc(100% - var(--sidebar-w)) !important;
      height: 100% !important;
      min-width: 0;
      border: none;
      display: block;
      background: #1a1d27;
    }

    /* === RESPONSIVE === */
    @media (max-width: 991px) {
      .main-container { flex-direction: column !important; position: relative !important; }
      #sidebar {
        position: fixed !important;
        left: -100vw !important;
        top: 0 !important;
        width: 92vw !important;
        max-width: 400px !important;
        height: 100vh !important;
        z-index: 1050 !important;
        box-shadow: 8px 0 30px rgba(0,0,0,0.4);
        transition: left 0.3s cubic-bezier(.4,0,.2,1);
        flex-direction: column !important;
      }
      #sidebar.show { left: 0 !important; }
      #mapFrame {
        position: relative !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100vh !important;
      }
      .nav-pills-row { padding: 10px 12px; }
    }
    #closeSidebarBtn { display: none; }
    @media (max-width: 991px) {
      #closeSidebarBtn { display: inline-block; }
    }

    /* === LEAFLET Z-INDEX === */
    .leaflet-control-layers, .leaflet-control-zoom, .leaflet-control-zoom-in,
    .leaflet-control-zoom-out, .leaflet-control, .leaflet-top, .leaflet-bottom,
    .leaflet-left, .leaflet-right, .leaflet-control-container,
    .leaflet-control-layers-base, .leaflet-control-layers-overlays,
    .leaflet-control-layers-toggle { z-index: 9999 !important; }
    .leaflet-control-zoom a, .leaflet-control-layers-toggle,
    .leaflet-control-layers-list { z-index: 9999 !important; }

    /* === MOBILE TOGGLE === */
    #openSidebarBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10000;
      background: var(--c-surface);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: none;
      transition: all var(--transition);
    }
    #openSidebarBtn:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    @media (max-width: 991px) {
      #openSidebarBtn { display: block; }
    }

    /* === BOOTSTRAP DARK OVERRIDES === */
    .accordion-body .card { background: var(--c-surface); color: var(--c-text); }
    .accordion-body .card-header { background: var(--c-surface-2); color: var(--c-text); }
    .form-check-label { color: var(--c-text); }
    .form-check-label.fw-bold { color: var(--c-text); }
    .text-muted { color: var(--c-text-3) !important; }
    .text-info { color: var(--c-accent) !important; }
    .text-success { color: var(--c-success) !important; }
    .text-danger { color: var(--c-danger) !important; }
    .text-warning { color: var(--c-orange) !important; }
    .btn-close { filter: invert(1); }
    .btn-outline-primary { color: var(--c-accent); border-color: var(--c-accent); }
    .btn-outline-primary:hover { background: var(--c-accent); color: #fff; }
    .btn-outline-success { color: var(--c-success); border-color: var(--c-success); }
    .btn-outline-warning { color: var(--c-orange); border-color: var(--c-orange); }
    .btn-outline-info { color: var(--c-accent); border-color: var(--c-accent); }
    .btn-check:checked + .btn-outline-primary,
    .btn-check:checked + .btn-outline-success,
    .btn-check:checked + .btn-outline-warning,
    .btn-check:checked + .btn-outline-info {
      color: #fff;
    }
    small.text-muted { color: var(--c-text-3) !important; }
    .form-range { accent-color: var(--c-accent); }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- SIDEBAR DOIT ÊTRE À GAUCHE - PREMIER ÉLÉMENT -->
    <div id="sidebar">
      <!-- Header -->
      <div class="sidebar-header">
        <div class="sidebar-brand"><span>Agri</span>Web</div>
        <button id="closeSidebarBtn" class="btn-close text-reset" type="button"></button>
      </div>

      <!-- Navigation pills -->
      <div class="nav-pills-row">
        <a href="/" class="nav-pill"><i class="bi bi-house"></i> Accueil</a>
        <a href="/crm" target="_blank" class="nav-pill"><i class="bi bi-folder2-open"></i> Projets</a>
        {% if is_admin %}
        <a href="/crm/stats" target="_blank" class="nav-pill"><i class="bi bi-bar-chart-line"></i> KPI</a>
        <a href="/admin" target="_blank" class="nav-pill" style="border-color:rgba(241,196,15,0.4);color:#f1c40f;"><i class="bi bi-shield-lock"></i> Admin</a>
        {% endif %}
        <a href="/logout" class="nav-pill pill-danger"><i class="bi bi-box-arrow-right"></i> Quitter</a>
      </div>

      <!-- Sections -->
      <div style="flex:1; overflow-y:auto; padding-bottom:16px;">
        <div class="accordion" id="searchAccordion">
          {% include 'search_panel.html' %}
        </div>
      </div>
    </div>
    <!-- CARTE DOIT ÊTRE À DROITE - DEUXIÈME ÉLÉMENT -->
    <iframe id="mapFrame" src="/static/map.html" title="Carte interactive"></iframe>
    
    <!-- Bouton flottant pour ouvrir la sidebar sur mobile -->
    <button id="openSidebarBtn" type="button">
      <i class="bi bi-list"></i>
    </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/main.js"></script>
  <script>
    // Sidebar responsive (fixe desktop, offcanvas mobile)
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebarBtn');
    const closeBtn = document.getElementById('closeSidebarBtn');

    function openSidebar() {
      sidebar.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      sidebar.classList.remove('show');
      document.body.style.overflow = '';
    }
    if (openBtn) openBtn.addEventListener('click', openSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);

    // Ferme sidebar sur clic extérieur (mobile uniquement)
    window.addEventListener('click', function(e) {
      if(window.innerWidth > 991) return;
      if(sidebar.classList.contains('show') && !sidebar.contains(e.target) && e.target !== openBtn) {
        closeSidebar();
      }
    });
    // Ferme la sidebar sur resize desktop
    window.addEventListener('resize', () => {
      if(window.innerWidth > 991) closeSidebar();
    });

    // Contrôle des calques depuis main.js
    function updateLayerSidebarControl(layers) {
      const list = document.getElementById("layerControlList");
      if (!list) return;
      list.innerHTML = '';
      Object.entries(layers).forEach(([key, config]) => {
        const li = document.createElement('li');
        const box = document.createElement('input');
        box.type = "checkbox";
        box.checked = true;
        box.dataset.layer = key;
        box.style.marginRight = "7px";
        box.onchange = function() {
          const m = document.getElementById("mapFrame").contentWindow;
          if (m && typeof m.toggleLayerVisibility === "function") {
            m.toggleLayerVisibility(key, box.checked);
          } else if (m && m.toggleLayerVisibility) {
            m.toggleLayerVisibility(key, box.checked);
          }
        };
        const color = document.createElement('span');
        color.className = 'layer-color';
        color.style.background = config.color || '#bbb';
        li.appendChild(box);
        li.appendChild(color);
        li.appendChild(document.createTextNode(config.label || key));
        list.appendChild(li);
      });
    }
    window.updateLayerSidebarControl = updateLayerSidebarControl;
    
    // Gestion du zoom automatique depuis les paramètres d'URL
    {% if zoom_lat and zoom_lon %}
    document.addEventListener('DOMContentLoaded', function() {
        // Vérifier si on a déjà fait la recherche automatique (éviter la boucle)
        const autoSearchDone = sessionStorage.getItem('autoSearchDone');
        if (autoSearchDone === 'true') {
            console.log('🔄 Recherche automatique déjà effectuée, annulation');
            return;
        }
        
        console.log('🎯 Zoom automatique demandé:', {{ zoom_lat }}, {{ zoom_lon }}, '{{ zoom_address }}');
        
        // Marquer que la recherche auto a été faite
        sessionStorage.setItem('autoSearchDone', 'true');
        
        // Attendre que la carte soit chargée avant de faire la recherche
        setTimeout(function() {
            // Déclencher une recherche par coordonnées
            const searchForm = document.querySelector('#address-search-form');
            const latInput = document.querySelector('#lat');
            const lonInput = document.querySelector('#lon');
            const addressInput = document.querySelector('#address');
            
            if (latInput && lonInput) {
                latInput.value = {{ zoom_lat }};
                lonInput.value = {{ zoom_lon }};
                {% if zoom_address %}
                if (addressInput) {
                    addressInput.value = '{{ zoom_address }}';
                }
                {% endif %}
                
                // Déclencher la recherche
                if (searchForm) {
                    console.log('🔍 Déclenchement recherche automatique');
                    searchForm.dispatchEvent(new Event('submit'));
                } else {
                    console.warn('Formulaire de recherche non trouvé');
                }
            } else {
                console.warn('Champs lat/lon non trouvés');
            }
        }, 2000);
    });
    {% endif %}
  </script>
  
  <!-- Autocomplétion pour adresses et communes -->
  <script src="{{ url_for('static', filename='autocomplete.js') }}"></script>
  <script>
    // Initialisation de l'autocomplete pour les adresses et communes
    document.addEventListener('DOMContentLoaded', function() {
      // Autocomplete pour le champ de recherche d'adresse
      const searchInput = document.getElementById('search_input');
      if (searchInput) {
        new Autocomplete(searchInput, {
          apiEndpoint: '/api/autocomplete/address',
          minChars: 3,
          onSelect: async function(suggestion) {
            // Protection contre les appels multiples simultanés
            const addressSearchKey = 'addressParcelSearchInProgress';
            if (sessionStorage.getItem(addressSearchKey) === 'true') {
              console.log('🔄 Recherche de parcelle déjà en cours, annulation');
              return;
            }
            
            sessionStorage.setItem(addressSearchKey, 'true');
            
            try {
              console.log('🏠 Adresse sélectionnée:', suggestion);
              
              const latInput = document.getElementById('latitude');
              const lonInput = document.getElementById('longitude');
              const addressInput = document.getElementById('address');
              const searchInput = document.getElementById('search_input');
              
              // Coordonnées de l'adresse (point dans la rue)
              const addressLat = suggestion.geometry?.coordinates?.[1];
              const addressLon = suggestion.geometry?.coordinates?.[0];
              
              if (!addressLat || !addressLon) {
                console.warn('⚠️ Coordonnées manquantes dans la suggestion (commune/ville)');
                console.log('📝 Remplissage du champ avec:', suggestion.label || suggestion.city || suggestion.display);
                
                // Remplir le champ address pour que l'utilisateur puisse cliquer sur rechercher
                const addressText = suggestion.label || suggestion.city || suggestion.display || searchInput?.value;
                if (addressInput) addressInput.value = addressText;
                if (searchInput) searchInput.value = addressText;
                
                // Vider les coordonnées pour forcer le géocodage lors du clic
                if (latInput) latInput.value = '';
                if (lonInput) lonInput.value = '';
                
                sessionStorage.removeItem(addressSearchKey);
                console.log('✅ Champ rempli. Cliquez sur "Rechercher" pour géocoder.');
                return;
              }
              
              console.log('📍 Coordonnées adresse (rue):', addressLat, addressLon);
              
              try {
                // Appeler l'API pour obtenir les coordonnées de la parcelle
                console.log('🔄 Recherche de la parcelle cadastrale...');
                const parcelResponse = await fetch(`/api/get_parcel_coords?lat=${addressLat}&lon=${addressLon}&buffer=20`);
                const parcelData = await parcelResponse.json();
                
                if (parcelData.fallback) {
                  console.warn('⚠️ Parcelle non trouvée, utilisation des coordonnées d\'adresse');
                  console.log('   Raison:', parcelData.message);
                  // Utiliser les coordonnées d'adresse
                  if (latInput) latInput.value = addressLat;
                  if (lonInput) lonInput.value = addressLon;
                } else {
                  console.log('✅ Parcelle trouvée !');
                  console.log('   📍 Centroïde parcelle:', parcelData.parcel_lat, parcelData.parcel_lon);
                  console.log('   🆔 ID parcelle:', parcelData.parcel_id);
                  console.log('   📏 Distance:', parcelData.distance, 'm');
                  
                  // Utiliser les coordonnées de la parcelle (centroïde)
                  if (latInput) latInput.value = parcelData.parcel_lat;
                  if (lonInput) lonInput.value = parcelData.parcel_lon;
                }
              } catch (error) {
                console.error('❌ Erreur lors de la recherche de parcelle:', error);
                // Fallback: utiliser les coordonnées d'adresse
                if (latInput) latInput.value = addressLat;
                if (lonInput) lonInput.value = addressLon;
              }
              
              // Remplir le champ adresse
              if (addressInput) {
                addressInput.value = suggestion.properties.label;
              }
            } finally {
              // Toujours nettoyer le flag, même en cas d'erreur
              sessionStorage.removeItem(addressSearchKey);
            }
          }
        });
      }
      
      // Autocomplete pour le champ de recherche par commune
      const communeInput = document.getElementById('commune');
      if (communeInput) {
        new Autocomplete(communeInput, {
          type: 'commune',
          minChars: 2,
          onSelect: function(suggestion) {
            console.log('🏘️ Commune sélectionnée:', suggestion);
            // La valeur est déjà définie dans l'input par la classe Autocomplete
            // On peut déclencher la recherche automatiquement si souhaité
          }
        });
      }
    });
  </script>

  <script src="{{ url_for('static', filename='js/sunstice-assistant.js') }}"></script>
  
  <!-- Script de synchronisation Helia <-> Carte -->
  <script>
    // Écouter les messages du clic droit carte (rechercher ici / rapport direct)
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.action) return;
      
      if (e.data.action === 'searchAt') {
        // Ouvrir l'accordion Adresse si fermé
        const accPane = document.getElementById('acc-pane-addr');
        if (accPane && !accPane.classList.contains('show')) {
          const btn = accPane.previousElementSibling?.querySelector('.accordion-button');
          if (btn) btn.click();
        }
        // Remplir le champ et soumettre
        const input = document.getElementById('search_input');
        if (input) {
          input.value = e.data.lat + ',' + e.data.lon;
          // Soumettre le formulaire
          const form = document.getElementById('unifiedSearchForm');
          if (form) form.dispatchEvent(new Event('submit', {cancelable:true}));
        }
      }
      
      if (e.data.action === 'reportAt') {
        const input = document.getElementById('search_input');
        if (input) {
          input.value = e.data.lat + ',' + e.data.lon;
          // Appeler directReportAddress
          if (typeof directReportAddress === 'function') {
            directReportAddress();
          } else if (typeof window.directReportAddress === 'function') {
            window.directReportAddress();
          }
        }
      }
    });

    // Attendre que l'iframe soit chargée
    window.addEventListener('load', function() {
      const mapFrame = document.getElementById('mapFrame');
      
      if (mapFrame) {
        mapFrame.addEventListener('load', function() {
          try {
            const mapWindow = mapFrame.contentWindow;
            
            // Vérifier que la carte Leaflet existe dans l'iframe
            if (mapWindow.map && typeof HeliaMapSync !== 'undefined') {
              console.log('🗺️ Initialisation de la synchronisation Helia <-> Carte');
              
              // Créer l'instance de synchronisation
              window.heliaMapSync = new HeliaMapSync(mapWindow.map);
              
              console.log('✅ Synchronisation Helia-Carte activée !');
            } else {
              console.warn('⚠️ Carte non trouvée dans iframe ou HeliaMapSync non chargé');
            }
          } catch (error) {
            console.error('❌ Erreur initialisation Helia-Carte:', error);
          }
        });
      } else {
        console.warn('⚠️ Iframe #mapFrame non trouvée');
      }
    });
  </script>
</body>
