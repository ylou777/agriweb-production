<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier - HeliaPV CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <style>
        /* ===== DARK MINIMAL — CRM CALENDRIER ===== */
        :root {
            --c-bg: #0f1117;
            --c-surface: #1a1d27;
            --c-surface-2: #22252f;
            --c-border: #2a2d3a;
            --c-border-light: #353849;
            --c-text: #e8eaed;
            --c-text-2: #9ba1b0;
            --c-text-3: #6b7185;
            --c-accent: #3b82f6;
            --c-accent-light: rgba(59,130,246,0.1);
            --c-green: #10b981;
            --c-orange: #f59e0b;
            --c-red: #ef4444;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(.4,0,.2,1);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--c-bg);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--c-text);
            -webkit-font-smoothing: antialiased;
        }

        /* TOP BAR */
        .navbar {
            background: var(--c-surface) !important;
            border-bottom: 1px solid var(--c-border);
            padding: 14px 24px;
        }
        .navbar-brand {
            font-size: 1rem;
            font-weight: 700;
            color: var(--c-text) !important;
            letter-spacing: -0.02em;
        }
        .navbar-brand i { color: var(--c-accent); margin-right: 6px; }
        .btn-outline-light {
            border-color: var(--c-border);
            color: var(--c-text-2);
            font-size: 0.8rem;
            border-radius: 20px;
            transition: all var(--transition);
        }
        .btn-outline-light:hover {
            background: var(--c-accent-light);
            border-color: var(--c-accent);
            color: var(--c-accent);
        }

        /* CARDS */
        .card {
            background: var(--c-surface);
            border: 1px solid var(--c-border) !important;
            border-radius: var(--radius);
        }
        .card-body h5 {
            color: var(--c-text);
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* BADGES */
        .rdv-visite   { background-color: var(--c-accent) !important; border-color: var(--c-accent) !important; }
        .rdv-appel    { background-color: var(--c-green) !important; border-color: var(--c-green) !important; }
        .rdv-reunion  { background-color: var(--c-red) !important; border-color: var(--c-red) !important; }
        .rdv-signature { background-color: var(--c-orange) !important; border-color: var(--c-orange) !important; color: #111 !important; }

        /* FULLCALENDAR DARK OVERRIDES */
        #calendar { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .fc { color: var(--c-text); }
        .fc .fc-toolbar-title { font-size: 1.1rem; font-weight: 700; color: var(--c-text); }
        .fc .fc-button {
            background: var(--c-surface-2) !important;
            border: 1px solid var(--c-border) !important;
            color: var(--c-text-2) !important;
            font-size: 0.8rem;
            border-radius: 6px !important;
            box-shadow: none !important;
        }
        .fc .fc-button:hover {
            background: var(--c-border-light) !important;
            color: var(--c-text) !important;
        }
        .fc .fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background: var(--c-accent) !important;
            border-color: var(--c-accent) !important;
            color: white !important;
        }
        .fc-theme-standard td,
        .fc-theme-standard th,
        .fc-theme-standard .fc-scrollgrid {
            border-color: var(--c-border) !important;
        }
        .fc .fc-daygrid-day { background: var(--c-surface); }
        .fc .fc-daygrid-day:hover { background: var(--c-surface-2); }
        .fc .fc-daygrid-day-number { color: var(--c-text-2); font-size: 0.82rem; }
        .fc .fc-day-today { background: rgba(59,130,246,0.07) !important; }
        .fc .fc-day-today .fc-daygrid-day-number { color: var(--c-accent); font-weight: 600; }
        .fc .fc-col-header-cell { background: var(--c-surface-2); }
        .fc .fc-col-header-cell-cushion { color: var(--c-text-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; }
        .fc .fc-list-day-cushion { background: var(--c-surface-2) !important; color: var(--c-text-2); }
        .fc .fc-list-event:hover td { background: var(--c-surface-2) !important; }
        .fc .fc-list-event td { background: var(--c-surface); border-color: var(--c-border); color: var(--c-text); }
        .fc-event { cursor: pointer; }

        /* MODAL */
        .modal-content {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            color: var(--c-text);
        }
        .modal-header {
            background: var(--c-surface-2) !important;
            border-bottom: 1px solid var(--c-border);
            color: var(--c-text) !important;
        }
        .modal-header h5 { color: var(--c-text); }
        .modal-header .btn-close { filter: invert(0.7); }
        .modal-footer {
            border-top: 1px solid var(--c-border);
        }
        .modal-body h6 { color: var(--c-text-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-body p { color: var(--c-text); }
        .modal-body .text-muted { color: var(--c-text-3) !important; }
        .modal-body small { color: var(--c-text-2); }
        .btn-secondary {
            background: var(--c-surface-2);
            border-color: var(--c-border);
            color: var(--c-text-2);
        }
        .btn-primary {
            background: var(--c-accent);
            border-color: var(--c-accent);
        }

        .icon-accent { color: var(--c-accent); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border-light); border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-calendar-event"></i> HeliaPV CRM — Calendrier
            </a>
            <div>
                <a href="/crm" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-folder2-open"></i> Projets
                </a>
                {% if is_admin %}
                <a href="/crm/stats" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-graph-up"></i> Dashboard
                </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <h5 class="mb-0"><i class="bi bi-calendar3"></i> Mes Rendez-vous</h5>
                            </div>
                            <div class="col-md-6 text-end">
                                <span class="badge rdv-visite me-2"><i class="bi bi-geo-alt"></i> Visite</span>
                                <span class="badge rdv-appel me-2"><i class="bi bi-telephone"></i> Appel</span>
                                <span class="badge rdv-reunion me-2"><i class="bi bi-people"></i> Réunion</span>
                                <span class="badge rdv-signature"><i class="bi bi-pen"></i> Signature</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id='calendar'></div>
    </div>

    <!-- Modal Détails Rendez-vous -->
    <div class="modal fade" id="rdvModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-calendar-event me-2 icon-accent"></i> Détails du Rendez-vous</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="rdvDetails">
                    <!-- Les détails seront insérés ici -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <a id="rdvProspectLink" href="#" class="btn btn-primary">
                        <i class="bi bi-person"></i> Voir le prospect
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/fr.global.min.js'></script>
    
    <script>
        let calendar;
        let rdvModal;
        let allAppointments = [];

        document.addEventListener('DOMContentLoaded', function() {
            rdvModal = new bootstrap.Modal(document.getElementById('rdvModal'));
            
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'fr',
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                buttonText: {
                    today: "Aujourd'hui",
                    month: 'Mois',
                    week: 'Semaine',
                    day: 'Jour',
                    list: 'Liste'
                },
                height: 'auto',
                events: [],
                eventClick: function(info) {
                    showAppointmentDetails(info.event.extendedProps);
                },
                eventClassNames: function(arg) {
                    const type = arg.event.extendedProps.type_rdv;
                    return [`rdv-${type}`];
                }
            });

            calendar.render();
            loadAppointments();
        });

        async function loadAppointments() {
            try {
                const response = await fetch('/api/crm/appointments');
                const data = await response.json();
                
                if (data.success) {
                    allAppointments = data.appointments;
                    
                    const events = data.appointments.map(apt => {
                        const prospect = apt.nom_prospect || apt.contact_nom || apt.adresse || 'Prospect';
                        const type = apt.type_rdv || 'visite';
                        
                        return {
                            title: `${getTypeIcon(type)} ${prospect}`,
                            start: apt.date_rdv,
                            extendedProps: apt,
                            className: `rdv-${type}`
                        };
                    });
                    
                    calendar.removeAllEvents();
                    calendar.addEventSource(events);
                    
                    console.log(`✅ ${events.length} rendez-vous chargés`);
                } else {
                    console.error('Erreur chargement rendez-vous:', data.error);
                }
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        function getTypeIcon(type) {
            const icons = {
                'visite': '📍',
                'appel': '📞',
                'reunion': '👥',
                'signature': '✍️'
            };
            return icons[type] || '📅';
        }

        function showAppointmentDetails(apt) {
            const prospect = apt.nom_prospect || apt.contact_nom || apt.adresse || 'Prospect';
            const type = apt.type_rdv || 'visite';
            const typeLabel = {
                'visite': 'Visite sur site',
                'appel': 'Appel téléphonique',
                'reunion': 'Réunion',
                'signature': 'Signature contrat'
            }[type] || type;
            
            const dateRdv = new Date(apt.date_rdv);
            const dateFormatted = dateRdv.toLocaleDateString('fr-FR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('rdvDetails').innerHTML = `
                <div class="mb-3">
                    <h6><i class="bi bi-person-circle"></i> Prospect</h6>
                    <p class="mb-1"><strong>${prospect}</strong></p>
                    <p class="text-muted small mb-0">
                        ${apt.adresse || 'Adresse non renseignée'}
                    </p>
                    ${apt.adresse ? `
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(apt.adresse)}" 
                       target="_blank" 
                       class="btn btn-sm btn-primary mt-2">
                        <i class="bi bi-geo-alt-fill"></i> Y aller (Google Maps)
                    </a>
                    ` : ''}
                </div>
                
                <div class="mb-3">
                    <h6><i class="bi bi-calendar-event"></i> Date et Heure</h6>
                    <p class="mb-0">${dateFormatted}</p>
                </div>
                
                <div class="mb-3">
                    <h6><i class="bi bi-tag"></i> Type de Rendez-vous</h6>
                    <span class="badge rdv-${type}">${getTypeIcon(type)} ${typeLabel}</span>
                </div>
                
                ${apt.contact_nom ? `
                <div class="mb-3">
                    <h6><i class="bi bi-person"></i> Contact</h6>
                    <p class="mb-1">${apt.contact_nom}</p>
                    ${apt.contact_email ? `<p class="text-muted small mb-1"><i class="bi bi-envelope"></i> ${apt.contact_email}</p>` : ''}
                    ${apt.contact_tel ? `<p class="text-muted small mb-0"><i class="bi bi-telephone"></i> ${apt.contact_tel}</p>` : ''}
                </div>
                ` : ''}
                
                ${apt.notes ? `
                <div class="mb-3">
                    <h6><i class="bi bi-sticky"></i> Notes</h6>
                    <p class="mb-0">${apt.notes}</p>
                </div>
                ` : ''}
                
                <div class="mb-3">
                    <h6><i class="bi bi-info-circle"></i> Statut</h6>
                    <span class="badge ${apt.statut === 'termine' ? 'bg-success' : apt.statut === 'annule' ? 'bg-danger' : 'bg-warning'}">
                        ${apt.statut === 'termine' ? 'Terminé' : apt.statut === 'annule' ? 'Annulé' : 'Prévu'}
                    </span>
                </div>
            `;
            
            document.getElementById('rdvProspectLink').href = `/crm?prospect=${apt.prospect_id}`;
            rdvModal.show();
        }
    </script>
</body>
</html>
