<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouverture CRM HeliaPV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .stats {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .stat-item {
            display: inline-block;
            margin: 0 15px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🌾</div>
        <h1 class="mb-3">CRM HeliaPV</h1>
        <p class="text-muted mb-4">Gestion de vos prospects solaires</p>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalProspects">...</div>
                <div class="stat-label">Prospects</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="nouveauxProspects">...</div>
                <div class="stat-label">Nouveaux</div>
            </div>
        </div>
        
        <button class="btn btn-primary btn-lg" onclick="openCRM()">
            <i class="bi bi-box-arrow-up-right me-2"></i>
            Ouvrir le CRM
        </button>
        
        <div class="mt-4">
            <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                L'application KPI HeliaPV va s'ouvrir dans une nouvelle fenêtre
            </small>
        </div>
    </div>

    <script>
        // Charger les statistiques
        fetch('/api/crm/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalProspects').textContent = data.total || 0;
                document.getElementById('nouveauxProspects').textContent = data.nouveaux || 0;
            })
            .catch(e => {
                console.error('Erreur stats:', e);
                document.getElementById('totalProspects').textContent = '0';
                document.getElementById('nouveauxProspects').textContent = '0';
            });
        
        function openCRM() {
            // Appeler l'API pour lancer le CRM
            fetch('/api/crm/launch', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ ' + data.message);
                    } else {
                        alert('❌ ' + (data.error || 'Erreur lors de l\'ouverture du CRM'));
                    }
                })
                .catch(e => {
                    alert('❌ Erreur: ' + e.message);
                });
        }
    </script>
</body>
</html>
