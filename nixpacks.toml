[phases.setup]
nixPkgs = ["python311", "gcc", "git"]

[phases.install]
cmds = [
    "git submodule update --init --recursive || echo 'No submodules or already initialized'",
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]

[start]
cmd = "gunicorn agriweb_hebergement_gratuit:app --bind 0.0.0.0:${PORT:-5000} --workers 2 --threads 4 --timeout 600 --graceful-timeout 300 --keep-alive 5 --max-requests 300 --max-requests-jitter 60"
